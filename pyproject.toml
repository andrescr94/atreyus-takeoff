[project]
name = "takeoff"
version = "0.1.0"
description = "AI electrical takeoff: count devices on vector electrical plans with evidence per count"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pillow>=10",
    "opencv-python-headless>=5.0.0.93",
    "anthropic>=2.3.0",
    "rapidocr-onnxruntime>=1.4.4",
    "python-multipart>=0.0.32",
]

[project.scripts]
takeoff = "takeoff.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["takeoff"]
